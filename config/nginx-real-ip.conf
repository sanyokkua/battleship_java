# Render image only. Render's edge appends the player's address to X-Forwarded-For and is the only thing that can
# reach this container, so take the LAST entry as the client address (real_ip_recursive stays off). Then
# nginx-server.conf.template replaces X-Forwarded-For with that single address for the backend.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header X-Forwarded-For;
