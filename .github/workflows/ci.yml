# CI: a build check on branch pushes, the full product gate on pull requests. Details: docs/ci.md
name: CI

on:
  push:
    branches-ignore: [master] # master is only reached through a gated PR; tag pushes never match branch filters
  pull_request:
    # Drop rewrite_prod_ready and 'feature/**' once the rewrite is merged into master.
    branches: [master, rewrite_prod_ready, 'feature/**']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Branch push: same commands as the Dockerfile `jar` and `dist` stages, no tests.
  build:
    name: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            frontend/package-lock.json
      - name: Package the backend
        run: cd backend && ./mvnw -q -DskipTests package
      - name: Build the frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build

  # Pull request: the one product gate, unchanged. It installs dependencies and Chromium itself.
  gate:
    name: gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            frontend/package-lock.json
      # Chromium's OS libraries; local-build.sh runs `playwright install chromium` without --with-deps.
      # Browsers themselves are deliberately not cached (Playwright advises against it).
      - name: Install the OS libraries Chromium needs
        run: npm --prefix frontend ci && npm --prefix frontend exec -- playwright install-deps chromium
      - name: Product gate
        run: ./scripts/local-build.sh
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-reports
          path: |
            frontend/playwright-report
            frontend/test-results
            backend/**/target/surefire-reports
            backend/**/target/failsafe-reports
          retention-days: 7
          if-no-files-found: ignore
