installed:
- cleanup
- diagram
- memory-loader
- speckit-superpowers-bridge
settings:
  auto_execute_hooks: true
hooks:
  after_implement:
  - extension: cleanup
    command: speckit.cleanup.run
    enabled: true
    optional: true
    priority: 10
    prompt: Run cleanup to review implementation changes and identify tech debt?
    description: Post-implementation quality gate
    condition: null
  before_specify:
  - extension: memory-loader
    command: speckit.memory-loader.load
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.memory-loader.load?
    description: Load project memory files before specification
    condition: null
  before_plan:
  - extension: memory-loader
    command: speckit.memory-loader.load
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.memory-loader.load?
    description: Load project memory files before planning
    condition: null
  - extension: speckit-superpowers-bridge
    command: speckit.speckit-superpowers-bridge.guard
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.speckit-superpowers-bridge.guard?
    description: Prevent Spec Kit contract changes while Superpowers implementation
      is executing
    condition: null
  before_tasks:
  - extension: memory-loader
    command: speckit.memory-loader.load
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.memory-loader.load?
    description: Load project memory files before task generation
    condition: null
  - extension: speckit-superpowers-bridge
    command: speckit.speckit-superpowers-bridge.guard
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.speckit-superpowers-bridge.guard?
    description: Prevent Spec Kit contract changes while Superpowers implementation
      is executing
    condition: null
  before_implement:
  - extension: memory-loader
    command: speckit.memory-loader.load
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.memory-loader.load?
    description: Load project memory files before implementation
    condition: null
  - extension: speckit-superpowers-bridge
    command: speckit.speckit-superpowers-bridge.guard
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.speckit-superpowers-bridge.guard?
    description: Block speckit.implement for features handed off to Superpowers
    condition: null
  before_clarify:
  - extension: memory-loader
    command: speckit.memory-loader.load
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.memory-loader.load?
    description: Load project memory files before clarification
    condition: null
  - extension: speckit-superpowers-bridge
    command: speckit.speckit-superpowers-bridge.guard
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.speckit-superpowers-bridge.guard?
    description: Prevent Spec Kit contract changes while Superpowers implementation
      is executing
    condition: null
  before_checklist:
  - extension: memory-loader
    command: speckit.memory-loader.load
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.memory-loader.load?
    description: Load project memory files before checklist generation
    condition: null
  before_analyze:
  - extension: memory-loader
    command: speckit.memory-loader.load
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.memory-loader.load?
    description: Load project memory files before analysis
    condition: null
  after_tasks:
  - extension: diagram
    command: speckit.diagram.dependencies
    enabled: true
    optional: true
    priority: 10
    prompt: Generate task dependency diagram after task breakdown?
    description: Auto-generate dependency DAG after tasks are created
    condition: null
  - extension: speckit-superpowers-bridge
    command: speckit.speckit-superpowers-bridge.handoff
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.speckit-superpowers-bridge.handoff?
    description: Create the Superpowers handoff after Spec Kit task generation
    condition: null
